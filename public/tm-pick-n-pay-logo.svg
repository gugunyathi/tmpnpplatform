<svg viewBox="0 0 200 200" width="200" height="200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Clean White Canvas -->
  <rect width="200" height="200" fill="#FFFFFF" />

  <!-- Top TM Emblem Card -->
  <g id="tm-emblem-card">
    <!-- Royal Blue Rounded Box -->
    <rect
      x="14"
      y="16"
      width="172"
      height="112"
      rx="10"
      fill="#0c67b9"
    />

    <!-- Inset White Border Line -->
    <rect
      x="22"
      y="24"
      width="156"
      height="96"
      rx="4"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="2.4"
    />

    <!-- Letter 'T' -->
    <g id="letter-t">
      <!-- T-Top Horizontal Bar -->
      <rect
        x="29"
        y="34"
        width="63"
        height="24"
        rx="12"
        fill="#5ec8f8"
        stroke="#FFFFFF"
        stroke-width="3.2"
      />
      <!-- T-Stem Vertical Bar -->
      <rect
        x="48"
        y="45"
        width="25"
        height="62"
        rx="12.5"
        fill="#5ec8f8"
        stroke="#FFFFFF"
        stroke-width="3.2"
      />
    </g>

    <!-- Letter 'M' (3 Parallel Leaning Capsules) -->
    <g id="letter-m">
      <!-- Stroke 1 (Left) -->
      <path
        d="M 103 36 C 109 36 114 41 114 47 L 97 97 C 97 103 92 108 86 108 C 80 108 75 103 75 97 L 92 47 C 92 41 97 36 103 36 Z"
        fill="#5ec8f8"
        stroke="#FFFFFF"
        stroke-width="3.2"
        stroke-linejoin="round"
      />
      <!-- Stroke 2 (Middle) -->
      <path
        d="M 129 36 C 135 36 140 41 140 47 L 123 97 C 123 103 118 108 112 108 C 106 108 101 103 101 97 L 118 47 C 118 41 123 36 129 36 Z"
        fill="#5ec8f8"
        stroke="#FFFFFF"
        stroke-width="3.2"
        stroke-linejoin="round"
      />
      <!-- Stroke 3 (Right) -->
      <path
        d="M 155 36 C 161 36 166 41 166 47 L 149 97 C 149 103 144 108 138 108 C 132 108 127 103 127 97 L 144 47 C 144 41 149 36 155 36 Z"
        fill="#5ec8f8"
        stroke="#FFFFFF"
        stroke-width="3.2"
        stroke-linejoin="round"
      />
    </g>
  </g>

  <!-- Bottom Pick n Pay Wordmark -->
  <g id="pick-n-pay-wordmark">
    <!-- Dark Navy Square for 'P' (Pick) -->
    <rect
      x="14"
      y="144"
      width="32"
      height="32"
      rx="5"
      fill="#0c2340"
    />
    <path
      d="M 23 152 L 31.5 152 C 35 152 37.5 153.8 37.5 157 C 37.5 160.2 35 162 31.5 162 L 27.5 162 L 27.5 168 L 23 168 Z M 27.5 155.5 L 27.5 158.5 L 31 158.5 C 32.5 158.5 33.2 158 33.2 157 C 33.2 156 32.5 155.5 31 155.5 Z"
      fill="#FFFFFF"
    />

    <!-- Letter 'ı' (dotless stem in navy) -->
    <rect x="50" y="154" width="4.5" height="14" rx="1" fill="#0c2340" />

    <!-- Letter 'c' (navy) -->
    <path
      d="M 68 158.5 C 66.5 155.5 63 153.5 59.5 153.5 C 55 153.5 51.5 157 51.5 161 C 51.5 165 55 168.5 59.5 168.5 C 63 168.5 66.5 166.5 68 163.5 L 64 161.5 C 63 163 61.5 164.5 59.5 164.5 C 57 164.5 55.5 163 55.5 161 C 55.5 159 57 157.5 59.5 157.5 C 61.5 157.5 63 159 64 160.5 Z"
      fill="#0c2340"
    />

    <!-- Letter 'k' (navy) -->
    <path
      d="M 70 148 L 74 148 L 74 158.5 L 79.5 154 L 85 154 L 78.5 159.5 L 85.5 168 L 80 168 L 74 161.5 L 74 168 L 70 168 Z"
      fill="#0c2340"
    />

    <!-- Letter 'n' (navy) -->
    <path
      d="M 93 154 L 97 154 L 97 157 C 98.8 154.5 101.5 153.5 104.5 153.5 C 109 153.5 111.5 156 111.5 160 L 111.5 168 L 107.5 168 L 107.5 161 C 107.5 158.5 106 157 103.5 157 C 100.5 157 97 159 97 162 L 97 168 L 93 168 Z"
      fill="#0c2340"
    />

    <!-- Crimson Red Square for 'P' (Pay) -->
    <rect
      x="117"
      y="144"
      width="32"
      height="32"
      rx="5"
      fill="#c8102e"
    />
    <path
      d="M 126 152 L 134.5 152 C 138 152 140.5 153.8 140.5 157 C 140.5 160.2 138 162 134.5 162 L 130.5 162 L 130.5 168 L 126 168 Z M 130.5 155.5 L 130.5 158.5 L 134 158.5 C 135.5 158.5 136.2 158 136.2 157 C 136.2 156 135.5 155.5 134 155.5 Z"
      fill="#FFFFFF"
    />

    <!-- Letter 'a' (red) -->
    <path
      d="M 152 161 C 152 156.5 155.5 153.5 160 153.5 C 164.5 153.5 168 156.5 168 160.5 L 168 168 L 164 168 L 164 166 C 162.5 167.5 160 168.5 157.5 168.5 C 154 168.5 151.5 166 151.5 162.5 C 151.5 159 154 157 158.5 156.5 L 164 156 L 164 155.5 C 164 153.5 162 152 159.5 152 C 157 152 155 153 154 154.5 Z M 164 160.5 L 160 161 C 157.5 161.5 156 162.5 156 163.5 C 156 165 157.5 166 159.5 166 C 162.5 166 164 163.5 164 161.5 Z"
      fill="#c8102e"
    />

    <!-- Letter 'y' (red) -->
    <path
      d="M 170 154 L 174.5 154 L 178 164 L 181.5 154 L 186 154 L 180 170 C 178.5 173.5 176 175.5 172.5 175.5 L 170 175.5 L 170 171.5 L 172 171.5 C 174 171.5 175.5 170.5 176.5 168 L 177 166 Z"
      fill="#c8102e"
    />
  </g>
</svg>
